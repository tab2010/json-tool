<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 网站图标：蓝色圆角方块 + 白色花括号，象征 JSON -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport：让页面在手机上也能正确缩放显示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 基础 SEO -->
    <title>JSON 格式化工具 - 隐私优先，数据不上传服务器</title>
    <meta name="description" content="隐私优先的在线 JSON 工具，支持格式化、压缩、JSON5 解析、大数精度保护、树形折叠视图，以及转 TypeScript / JSON Schema / YAML / CSV。所有数据仅在本地浏览器处理，不上传服务器。" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="canonical" href="https://jsonfmt.net/" />

    <!-- Open Graph（分享到微信/推特等社交平台时显示） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JSON 格式化工具" />
    <meta property="og:title" content="JSON 格式化工具 - 隐私优先，数据不上传服务器" />
    <meta property="og:description" content="格式化、压缩、JSON5 解析、大数保护、树形视图、转 TypeScript / YAML / CSV，数据不上传服务器。" />
    <meta property="og:url" content="https://jsonfmt.net/" />
    <meta property="og:image" content="https://jsonfmt.net/og-image.jpg" />
    <meta property="og:locale" content="zh_CN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="JSON 格式化工具 - 隐私优先" />
    <meta name="twitter:description" content="格式化、压缩、JSON5 解析、大数保护、树形视图、转 TypeScript / YAML / CSV，数据不上传服务器。" />
    <meta name="twitter:image" content="https://jsonfmt.net/og-image.jpg" />
  </head>
  <body>
    <!-- Vue 的"挂载点"：整个应用会被渲染到这个 div 里面 -->
    <div id="app"></div>

    <!-- 这是整个应用唯一的 JS 入口：浏览器从这里开始加载 Vue 应用 -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
