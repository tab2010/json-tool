<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport：让页面在手机上也能正确缩放显示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="隐私优先的 JSON 格式化工具，数据仅在本地浏览器处理，不上传服务器。" />
    <title>JSON 格式化工具 - 隐私优先</title>
  </head>
  <body>
    <!-- Vue 的"挂载点"：整个应用会被渲染到这个 div 里面 -->
    <div id="app"></div>

    <!-- 这是整个应用唯一的 JS 入口：浏览器从这里开始加载 Vue 应用 -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
